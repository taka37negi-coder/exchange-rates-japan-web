name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install
      - name: Build for web
        run: npx expo export -p web
      
      - name: Fix asset paths for GitHub Pages
        run: |
          cd dist
          find . -name "*.html" -type f -exec sed -i 's|/_expo/static|/exchange-rates-japan-web/_expo/static|g' {} +
          find . -name "*.js" -type f -exec sed -i 's|"/_expo/static|"/exchange-rates-japan-web/_expo/static|g' {} +
          find . -name "*.js" -type f -exec sed -i "s|'/_expo/static|'/exchange-rates-japan-web/_expo/static|g" {} +
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

